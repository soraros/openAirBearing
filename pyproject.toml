[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openairbearing"
dynamic = ["version"]
description = "A Python package for externally pressurized air bearing analysis."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mikael Miettinen", email = "mikael.miettinen@iki.fi" }]
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "dash>=4.1.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "plotly>=6.6.0",
    "pytest>=9.0.2",
    "scipy>=1.17.1",
]

[project.urls]
Homepage = "https://github.com/Aalto-Arotor/openAirBearing"
"Online demo" = "https://www.openairbearing.com"

[project.scripts]
openairbearing = "openairbearing.app.app:main"

[tool.hatch.version]
path = "openairbearing/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["openairbearing"]

[tool.ruff]
indent-width = 2
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E111", "E114"]

[tool.ruff.format]
indent-style = "space"
